<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Lazy Chunk Boat Cannon Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <h1>Boat Cannon Calculator</h1>
    </header>

    <main class="grid-layout">
      <!-- Input Controls Section -->
      <section class="card control-panel">
        <h2 class="card-title">Parameters</h2>
        
        <div class="form-container">
          <!-- Coordinates Section -->
          <div class="form-group-box">
            <span class="group-title">Origin Coordinate (X, Z)</span>
            <div class="grid-2">
              <div class="form-row">
                <label for="origin-x">Origin X</label>
                <input type="number" id="origin-x" value="0" step="any">
              </div>
              <div class="form-row">
                <label for="origin-z">Origin Z</label>
                <input type="number" id="origin-z" value="0" step="any">
              </div>
            </div>
          </div>

          <div class="form-group-box">
            <span class="group-title">Target Coordinate (X, Z)</span>
            <div class="grid-2">
              <div class="form-row">
                <label for="target-x">Target X</label>
                <input type="number" id="target-x" value="500" step="any">
              </div>
              <div class="form-row">
                <label for="target-z">Target Z</label>
                <input type="number" id="target-z" value="0" step="any">
              </div>
            </div>
          </div>

          <!-- Launcher Settings -->
          <div class="form-group-box">
            <span class="group-title">Cannon Settings</span>
            <div class="grid-2">
              <div class="form-row">
                <label for="max-boat-stack">Max Boat Stack</label>
                <input type="number" id="max-boat-stack" value="50" step="1" min="1">
              </div>
              <div class="form-row">
                <label for="max-ticks">Max Ticks</label>
                <input type="number" id="max-ticks" value="200" step="1" min="1">
              </div>
            <div class="grid-2" style="margin-top: 10px;">
              <div class="form-row">
                <label for="cannon-delay">Cannon Delay (ticks)</label>
                <input type="number" id="cannon-delay" value="0" step="1">
              </div>
              <div class="form-row">
                <label for="powder-snow-version">Powder Snow Version</label>
                <select id="powder-snow-version">
                  <option value="0.95" selected>1.21.9+ (0.95)</option>
                  <option value="0.90">Pre-1.21.9 (0.90)</option>
                </select>
              </div>
            </div>
          </div>


          <button class="btn btn-primary" id="btn-calculate">Calculate Solutions</button>
        </div>
      </section>

      <!-- Results Solver Section -->
      <section class="card results-panel">
        <h2 class="card-title">Optimal Configurations (<span id="results-count">0 solutions</span>)</h2>

        <div class="table-wrap">
          <table class="spreadsheet-table" id="solver-table">
            <thead>
              <tr>
                <th>Ticks (t)</th>
                <th>X Boats</th>
                <th>Z Boats</th>
                <th>Landing (X, Z)</th>
                <th>Distance Error</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="solver-tbody">
              <tr>
                <td colspan="6" class="table-placeholder">Enter values and click Calculate...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="teleport-command-box">
          <span class="command-label">Teleport Command to Landing Point:</span>
          <div class="command-container">
            <code id="tp-command">/tp @p 0.00 ~ 0.00</code>
            <button class="btn btn-secondary btn-sm" id="btn-copy-command">Copy Command</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
